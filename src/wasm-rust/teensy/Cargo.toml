[package]
name = "arp3-teensy"
version = "0.1.0"
edition.workspace = true

[features]
# Forwarded to arp3-engine. Default on = early micro-timing + flam at the cost
# of a small fixed latency. Build `cargo build --profile teensy
# --no-default-features` for zero added MIDI latency on hardware.
default = ["lookahead"]
lookahead = ["arp3-engine/lookahead"]

[dependencies]
arp3-engine = { path = "../engine", default-features = false }
arp3-synth = { path = "../synth" }
teensy4-bsp = { version = "0.6", features = ["rt"] }
teensy4-panic = "0.3"
cortex-m = "0.7"
embedded-alloc = "0.7"
usb-device = "0.3" # USB device framework (matches teensy4-bsp's version)
